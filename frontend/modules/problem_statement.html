<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề bài | Online Judge</title>
    <link rel="stylesheet" href="../assets/css/styles.css?v=20261101l">
</head>
<body>
    <main class="page-shell">
        <header class="site-header">
            <a class="brand" href="../">
                <span class="brand-mark" aria-hidden="true">OJ</span>
                <span>Online Judge</span>
            </a>
            <div class="button-row">
                <a id="back-link" href="problems.html">Quay lại</a>
                <button id="logout-button" class="secondary" type="button">Đăng xuất</button>
            </div>
        </header>

        <section class="card dashboard-card">
            <p class="eyebrow">ĐỀ BÀI</p>
            <article id="problem-statement" class="problem-statement-preview" hidden>
                <h1 id="statement-title"></h1>
                <section id="statement-description-section" hidden>
                    <h2>Mô tả</h2>
                    <p id="statement-description" class="preview-content"></p>
                </section>
                <section id="statement-input-section" hidden>
                    <h2>Input</h2>
                    <p id="statement-input" class="preview-content"></p>
                </section>
                <section id="statement-output-section" hidden>
                    <h2>Output</h2>
                    <p id="statement-output" class="preview-content"></p>
                </section>
                <section id="statement-constraints-section" hidden>
                    <h2>Giới hạn dữ liệu</h2>
                    <p id="statement-constraints" class="preview-content"></p>
                </section>
                <section id="statement-limits-section" hidden>
                    <h2>Giới hạn chấm</h2>
                    <p id="statement-limits" class="preview-content"></p>
                </section>
            </article>
            <p id="page-message" class="message" role="alert"></p>
        </section>
    </main>
    <script type="module" src="../assets/js/problem_statement.js?v=20261101b"></script>
</body>
</html>
