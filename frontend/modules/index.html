<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Judge</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <main class="page-shell">
        <header class="site-header">
            <a class="brand" href="../">
                <span class="brand-mark" aria-hidden="true">OJ</span>
                <span>Online Judge</span>
            </a>
            <div class="button-row">
                <a id="manage-accounts-link" href="manage_accounts.html" hidden>Quản lý tài khoản</a>
                <button id="logout-button" class="secondary" type="button">Đăng xuất</button>
            </div>
        </header>

        <section class="card dashboard-card" aria-labelledby="account-heading">
            <div class="dashboard-header">
                <div>
                    <h1 id="account-heading">Thông tin tài khoản</h1>
                    <p class="page-subtitle">Xem và cập nhật hồ sơ cá nhân của bạn.</p>
                </div>
            </div>
            <dl class="profile-grid">
                <div class="profile-item">
                    <dt>ID tài khoản</dt>
                    <dd id="account-id"></dd>
                </div>
                <div class="profile-item">
                    <dt>Tên hiển thị</dt>
                    <dd>
                        <span id="account-name"></span>
                        <input id="account-name-input" type="text" minlength="3" maxlength="100" hidden>
                    </dd>
                </div>
                <div class="profile-item">
                    <dt>Email</dt>
                    <dd id="account-email"></dd>
                </div>
                <div class="profile-item">
                    <dt>Mã tài khoản</dt>
                    <dd id="account-code"></dd>
                </div>
                <div class="profile-item">
                    <dt>Vai trò</dt>
                    <dd id="account-role"></dd>
                </div>
                <div class="profile-item">
                    <dt>Ngày tạo</dt>
                    <dd><time id="account-created-at"></time></dd>
                </div>
            </dl>
            <div class="button-row profile-actions">
                <button id="edit-name-button" type="button">Sửa tên</button>
                <button id="save-name-button" type="button" hidden>Lưu thay đổi</button>
                <button id="cancel-name-button" class="secondary" type="button" hidden>Hủy</button>
                <button id="delete-account-button" class="secondary" type="button">Xóa tài khoản</button>
            </div>
            <p id="profile-message" class="message" role="status"></p>
            <p id="logout-error" class="message" role="alert"></p>
        </section>
    </main>
    <script type="module" src="../assets/js/account.js"></script>
</body>
</html>
