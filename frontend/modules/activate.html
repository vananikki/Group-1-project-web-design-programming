<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kích hoạt tài khoản</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <main class="auth-layout">
        <section class="card auth-card">
            <a class="brand" href="../">
                <span class="brand-mark" aria-hidden="true">OJ</span>
                <span>Online Judge</span>
            </a>
            <h1>Kích hoạt tài khoản</h1>
            <p class="page-subtitle">Nhập email và mã xác thực để kích hoạt tài khoản của bạn.</p>

            <form id="activate-form" class="form-grid">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="verification-code">Mã xác thực</label>
                    <input type="text" id="verification-code" name="verification_code" inputmode="numeric" maxlength="6" placeholder="6 chữ số" required>
                </div>

                <div class="form-actions">
                    <button type="button" id="send-code-button" class="secondary">Gửi mã</button>
                    <button type="submit" id="verify-button">Xác thực</button>
                </div>
            </form>

            <div class="form-actions compact-row">
                <button type="button" class="secondary" id="login-button">Đăng nhập</button>
                <button type="button" class="secondary" id="register-button">Đăng ký</button>
            </div>

            <p id="status-message" class="message" role="status"></p>
        </section>
    </main>
    <script type="module" src="../assets/js/activate.js"></script>
</body>
</html>
