<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <main class="auth-layout">
        <section class="card auth-card">
            <a class="brand" href="../">
                <span class="brand-mark" aria-hidden="true">OJ</span>
                <span>Online Judge</span>
            </a>
            <h1>Quên mật khẩu</h1>
            <p class="page-subtitle">Nhập email của bạn, nhận mã xác thực và đặt lại mật khẩu mới.</p>

            <form id="forgot-password-form" class="form-grid">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="verification-code">Mã xác thực</label>
                    <input type="text" id="verification-code" name="verification_code" inputmode="numeric" maxlength="6" placeholder="6 chữ số" required>
                </div>

                <div class="field">
                    <label for="new-password">Mật khẩu mới</label>
                    <input type="password" id="new-password" name="new_password" maxlength="128" autocomplete="new-password" placeholder="Nhập mật khẩu mới" required>
                </div>

                <div class="field">
                    <label for="confirm-password">Nhập lại mật khẩu mới</label>
                    <input type="password" id="confirm-password" name="confirm_password" maxlength="128" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" required>
                </div>

                <div class="form-actions">
                    <button type="button" id="send-code-button" class="secondary">Gửi mã</button>
                    <button type="submit" id="reset-button">Đặt lại mật khẩu</button>
                </div>
            </form>

            <div class="form-actions compact-row" style="margin-top: 18px;">
                <button type="button" class="secondary" id="login-button">Đăng nhập</button>
                <button type="button" class="secondary" id="register-button">Đăng ký</button>
            </div>

            <p id="status-message" class="message" role="status"></p>
        </section>
    </main>
    <script type="module" src="../assets/js/forgot-password.js"></script>
</body>
</html>
