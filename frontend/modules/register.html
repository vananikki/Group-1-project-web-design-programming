<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng kí</title>
</head>
<body>
    <h1>Tạo tài khoản</h1>

    <form id="register-form">
        <div>
            <label for="account-name">Tên tài khoản</label>
            <input
                type="text"
                id="account-name"
                name="account_name"
                minlength="3"
                maxlength="100"
                required
            >
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="128"
                required
            >
        </div>

        <div>
            <label for="confirm-password">Nhập lại mật khẩu</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm_password"
                minlength="8"
                maxlength="128"
                required
            >
        </div>

        <button type="submit">Tạo tài khoản</button>
        <button type="button" id="login-button">Đăng nhập</button>
    </form>

    <p id="status-message" role="status"></p>

    <script>
        const form = document.getElementById("register-form");
        const statusMessage = document.getElementById("status-message");

        document.getElementById("login-button").addEventListener("click", () => {
            window.location.href = "login.html";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            statusMessage.textContent = "";

            const accountName = document.getElementById("account-name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                statusMessage.textContent = "Mật khẩu nhập lại không khớp";
                return;
            }

            try {
                const response = await fetch(
                    "http://100.73.218.40:8000/auth/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            account_name: accountName,
                            account_email: email,
                            password: password
                        })
                    }
                );

                const data = response.headers.get("content-type")?.includes("application/json")
                    ? await response.json()
                    : {};

                if (!response.ok) {
                    statusMessage.textContent =
                        data.detail || `Không thể tạo tài khoản (${response.status})`;
                    return;
                }

                statusMessage.textContent = "Tạo tài khoản thành công. Đang chuyển đến đăng nhập...";
                window.setTimeout(() => {
                    window.location.replace("login.html");
                }, 1000);
            } catch (error) {
                console.error(error);
                statusMessage.textContent = "Không thể kết nối đến server";
            }
        });
    </script>
</body>
</html>
