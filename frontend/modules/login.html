<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <main class="auth-layout">
        <section class="card auth-card">
            <a class="brand" href="../">
                <span class="brand-mark" aria-hidden="true">OJ</span>
                <span>Online Judge</span>
            </a>
            <h1>Chào mừng trở lại</h1>
            <p class="page-subtitle">Đăng nhập để tiếp tục hành trình luyện tập của bạn.</p>

            <form id="login-form" class="form-grid">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="form-actions">
                    <button type="submit">Đăng nhập</button>
                    <button type="button" class="secondary" id="register-button">Đăng kí</button>
                </div>
            </form>

            <p class="helper-link">
                <a href="forgot-password.html">Quên mật khẩu?</a>
            </p>

            <p id="error-message" class="message" role="alert"></p>
        </section>
    </main>
    <script type="module" src="../assets/js/login.js?v=20261010"></script>
</body>
</html>
